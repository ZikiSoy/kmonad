# Source: https://github.com/xmonad/xmonad-contrib/blob/e2ffa533da76e6375179eff942bb0647dd22fb58/.github/workflows/hlint.yaml
name: hlint

# Fork (ZikiSoy/kmonad): upstream CI only on demand, so pushes don't queue
# a dozen jobs in front of the macOS build.
on:
  workflow_dispatch:

jobs:
  hlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 'Set up HLint'
      uses: haskell-actions/hlint-setup@v2
      with:
        version: '3.5'

    - name: 'Run HLint'
      uses: haskell-actions/hlint-run@v2
      with:
        path: '["src/", "test/", "app/"]'
        fail-on: status
