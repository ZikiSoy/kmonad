name: macOS Apple Silicon build

# Builds kmonad for Apple Silicon Macs (M1 and later) against the
# Karabiner DriverKit VirtualHIDDevice (dext).
#
# The dext client is compiled into kmonad and its IPC protocol must match the
# installed VirtualHIDDevice daemon, so one binary is built per protocol:
#
#   VirtualHIDDevice 6.x -> client protocol 5 -> kmonad-p5
#   VirtualHIDDevice 7.x -> client protocol 6 -> kmonad-p6
#   VirtualHIDDevice 8.x -> client protocol 7 -> kmonad-p7
#
# The bundle also ships `kmonad`, a launcher that reads the installed
# VirtualHIDDevice version and execs the matching binary.
# The `app` job packs everything into KMonad.app (menu bar app + root
# supervisor LaunchDaemon) and a KMonad-<version>.pkg installer, then
# installs/uninstalls it on the runner as a smoke test.
# Pushing a tag like v0.4.x-mac also publishes the .pkg as a GitHub release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS arm64 dext (protocol ${{ matrix.protocol }})
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: 5
            vhid: v6.14.0
          - protocol: 6
            vhid: v7.3.0
          - protocol: 7
            vhid: v8.5.0

    steps:
      - name: Clone project (with Karabiner submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use VirtualHIDDevice ${{ matrix.vhid }}
        shell: bash
        run: |
          cd c_src/mac/Karabiner-DriverKit-VirtualHIDDevice
          git fetch --depth 1 origin "refs/tags/${{ matrix.vhid }}:refs/tags/${{ matrix.vhid }}"
          git checkout -q "${{ matrix.vhid }}"
          grep -q "embedded_client_protocol_version(${{ matrix.protocol }})" \
            include/pqrs/karabiner/driverkit/client_protocol_version.hpp

      - name: Read resolver and GHC version
        id: ghc-version
        shell: bash
        run: |
          RESOLVER=$(awk '/^resolver:/ {print $2}' stack.yaml)
          GHCVER=$(curl -fsSL "https://www.stackage.org/${RESOLVER}/ghc-major-version")
          echo "ghc=$GHCVER" >> "$GITHUB_OUTPUT"
          echo "Resolver $RESOLVER -> GHC $GHCVER"

      - uses: haskell-actions/setup@v2
        id: hs-setup
        with:
          ghc-version: ${{ steps.ghc-version.outputs.ghc }}
          enable-stack: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: ${{ steps.hs-setup.outputs.stack-root }}
          key: stack-macos-arm64-${{ hashFiles('stack.yaml', '*.cabal') }}
          restore-keys: stack-macos-arm64-

      - name: Build
        shell: bash
        run: |
          stack build \
            --no-terminal --system-ghc \
            --flag kmonad:dext \
            --copy-bins --local-bin-path dist

      - name: Check binary
        shell: bash
        run: |
          file dist/kmonad
          lipo -archs dist/kmonad | grep -q arm64
          mv dist/kmonad "dist/kmonad-p${{ matrix.protocol }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kmonad-p${{ matrix.protocol }}
          path: dist/kmonad-p${{ matrix.protocol }}

  app:
    name: KMonad.app + installer
    needs: build
    runs-on: macos-latest
    env:
      VHID_VERSION: v8.5.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kmonad-p*
          path: kbin
          merge-multiple: true

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.4.5-zk.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build menu bar app
        shell: bash
        run: |
          A=build/KMonad.app/Contents
          mkdir -p "$A/MacOS" "$A/Resources/bin/shims"
          swiftc -O -target arm64-apple-macos13.0 -parse-as-library \
            ci/macos/app/KMonadMenu.swift -o "$A/MacOS/KMonad"
          sed -e "s/__VERSION__/${{ steps.v.outputs.version }}/" -e "s/__BUILD__/${GITHUB_RUN_NUMBER}/" \
            ci/macos/app/Info.plist > "$A/Info.plist"
          cp kbin/kmonad-p* "$A/Resources/bin/"
          cp ci/macos/kmonad-launcher.sh "$A/Resources/bin/kmonad"
          cp ci/macos/app/kmonad-supervisor "$A/Resources/bin/"
          cp ci/macos/app/shims/open "$A/Resources/bin/shims/"
          cp ci/macos/app/template.kbd ci/macos/app/uninstall.sh \
             ci/macos/app/io.github.zikisoy.kmonad.supervisor.plist "$A/Resources/"
          chmod 755 "$A/MacOS/KMonad" "$A/Resources/bin/"* "$A/Resources/bin/shims/open" "$A/Resources/uninstall.sh"
          codesign --force --deep --sign - build/KMonad.app
          codesign --verify --deep --verbose=2 build/KMonad.app
          find build/KMonad.app -type f | sort

      - name: Fetch Karabiner VirtualHIDDevice ${{ env.VHID_VERSION }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkgscripts
          cp ci/macos/app/pkg-scripts/* pkgscripts/
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/tags/$VHID_VERSION" \
            | jq -r '.assets[] | select(.name | endswith(".pkg")) | .browser_download_url' | head -1)
          echo "$URL"
          curl -fsSL -o pkgscripts/Karabiner-DriverKit-VirtualHIDDevice.pkg "$URL"
          pkgutil --check-signature pkgscripts/Karabiner-DriverKit-VirtualHIDDevice.pkg | tee sig.txt
          grep -q "G43BCU2T37" sig.txt   # pqrs.org Developer ID

      - name: Build installer
        shell: bash
        run: |
          V=${{ steps.v.outputs.version }}
          pkgbuild --root build --install-location /Applications \
            --scripts pkgscripts --identifier io.github.zikisoy.kmonad \
            --version "$V" --component-plist /dev/stdin component.pkg <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array><dict>
            <key>RootRelativeBundlePath</key><string>KMonad.app</string>
            <key>BundleIsRelocatable</key><false/>
            <key>BundleIsVersionChecked</key><false/>
            <key>BundleHasStrictIdentifier</key><false/>
            <key>BundleOverwriteAction</key><string>upgrade</string>
          </dict></array></plist>
          EOF
          productbuild --package component.pkg "KMonad-$V.pkg"
          shasum -a 256 "KMonad-$V.pkg" | tee "KMonad-$V.pkg.sha256"
          echo "PKG=KMonad-$V.pkg" >> "$GITHUB_ENV"

      - name: Smoke test - install on this runner
        shell: bash
        timeout-minutes: 10
        run: |
          sudo installer -pkg "$PKG" -target /
          sleep 8
          sudo launchctl print system/io.github.zikisoy.kmonad.supervisor | grep -E "state|pid"
          cat "/Library/Application Support/KMonad/status.json"
          python3 -c "import json;d=json.load(open('/Library/Application Support/KMonad/status.json'));print('vhid:',d['vhid'])"
          ls -l /usr/local/bin/kmonad
          /usr/local/bin/kmonad -d /Applications/KMonad.app/Contents/Resources/template.kbd && echo "template parses"
          pgrep -lf KMonad.app || echo "(menu app not started: no GUI session on CI)"
          cat /Library/Logs/KMonad/supervisor.log
          sudo /Applications/KMonad.app/Contents/Resources/uninstall.sh
          test ! -e /Library/LaunchDaemons/io.github.zikisoy.kmonad.supervisor.plist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KMonad-installer
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
