name: macOS Apple Silicon build

# Builds kmonad for Apple Silicon Macs (M1 and later) against the
# Karabiner DriverKit VirtualHIDDevice (dext), and uploads the binary.
# Pushing a tag like v0.4.x-mac also publishes it as a GitHub release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS arm64 (dext)
    runs-on: macos-14   # Apple Silicon (M1) runner

    steps:
      - name: Clone project (with Karabiner submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read resolver and GHC version
        id: ghc-version
        shell: bash
        run: |
          RESOLVER=$(awk '/^resolver:/ {print $2}' stack.yaml)
          GHCVER=$(curl -fsSL "https://www.stackage.org/${RESOLVER}/ghc-major-version")
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          echo "ghc=$GHCVER" >> "$GITHUB_OUTPUT"
          echo "Resolver $RESOLVER -> GHC $GHCVER"

      - uses: haskell-actions/setup@v2
        id: hs-setup
        with:
          ghc-version: ${{ steps.ghc-version.outputs.ghc }}
          enable-stack: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: ${{ steps.hs-setup.outputs.stack-root }}
          key: stack-macos-arm64-${{ hashFiles('stack.yaml', '*.cabal') }}
          restore-keys: stack-macos-arm64-

      - name: Build
        shell: bash
        run: |
          stack build \
            --no-terminal --system-ghc \
            --flag kmonad:dext \
            --copy-bins --local-bin-path dist

      - name: Check binary
        shell: bash
        run: |
          file dist/kmonad
          dist/kmonad --version || true

      - name: Package
        id: pkg
        shell: bash
        run: |
          NAME="kmonad-macos-arm64-dext"
          cp dist/kmonad "$NAME"
          chmod +x "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
