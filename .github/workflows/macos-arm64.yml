name: macOS Apple Silicon build

# KMonad for Mac (design v2): builds kmonad for each Karabiner
# VirtualHIDDevice client protocol, the KMonad.app (menu bar + root daemon),
# tests it, signs it with the fixed self-signed certificate from the
# MACOS_SIGN_P12 / MACOS_SIGN_P12_PASSWORD secrets (ad hoc without them) and
# packs KMonad-<version>.pkg.
#
#   VirtualHIDDevice 6.x -> client protocol 5 -> kmonad-p5
#   VirtualHIDDevice 7.x -> client protocol 6 -> kmonad-p6
#   VirtualHIDDevice 8.x -> client protocol 7 -> kmonad-p7

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS arm64 dext (protocol ${{ matrix.protocol }})
    runs-on: macos-latest   # Apple Silicon (arm64) runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: 5
            vhid: v6.14.0
          - protocol: 6
            vhid: v7.3.0
          - protocol: 7
            vhid: v8.5.0

    steps:
      - name: Clone project (with Karabiner submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use VirtualHIDDevice ${{ matrix.vhid }}
        shell: bash
        run: |
          cd c_src/mac/Karabiner-DriverKit-VirtualHIDDevice
          git fetch --depth 1 origin "refs/tags/${{ matrix.vhid }}:refs/tags/${{ matrix.vhid }}"
          git checkout -q "${{ matrix.vhid }}"
          grep -q "embedded_client_protocol_version(${{ matrix.protocol }})" \
            include/pqrs/karabiner/driverkit/client_protocol_version.hpp

      - name: Read resolver and GHC version
        id: ghc-version
        shell: bash
        run: |
          RESOLVER=$(awk '/^resolver:/ {print $2}' stack.yaml)
          GHCVER=$(curl -fsSL "https://www.stackage.org/${RESOLVER}/ghc-major-version")
          echo "ghc=$GHCVER" >> "$GITHUB_OUTPUT"
          echo "Resolver $RESOLVER -> GHC $GHCVER"

      - uses: haskell-actions/setup@v2
        id: hs-setup
        with:
          ghc-version: ${{ steps.ghc-version.outputs.ghc }}
          enable-stack: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: ${{ steps.hs-setup.outputs.stack-root }}
          key: stack-macos-arm64-${{ hashFiles('stack.yaml', '*.cabal') }}
          restore-keys: stack-macos-arm64-

      - name: Build
        shell: bash
        run: |
          stack build \
            --no-terminal --system-ghc \
            --flag kmonad:dext \
            --copy-bins --local-bin-path dist

      - name: Check binary
        shell: bash
        run: |
          file dist/kmonad
          lipo -archs dist/kmonad | grep -q arm64
          mv dist/kmonad "dist/kmonad-p${{ matrix.protocol }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kmonad-p${{ matrix.protocol }}
          path: dist/kmonad-p${{ matrix.protocol }}

  app:
    name: KMonad.app + installer
    needs: build
    runs-on: macos-latest
    env:
      VHID_VERSION: v8.5.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kmonad-p*
          path: kbin
          merge-multiple: true

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.4.5-zk.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: swift test --package-path macos/KMonad

      - name: Build KMonad
        id: swift
        shell: bash
        run: |
          swift build -c release --arch arm64 --package-path macos/KMonad
          echo "bin=$(swift build -c release --arch arm64 --package-path macos/KMonad --show-bin-path)" >> "$GITHUB_OUTPUT"

      - name: Daemon integration test
        shell: bash
        timeout-minutes: 10
        run: macos/tests/daemon-test.sh "${{ steps.swift.outputs.bin }}/KMonad" macos/pkg/kmonad-cmd

      - name: Assemble KMonad.app
        shell: bash
        run: |
          A=build/KMonad.app/Contents
          mkdir -p "$A/MacOS" "$A/Resources/bin"
          cp "${{ steps.swift.outputs.bin }}/KMonad" "$A/MacOS/KMonad"
          sed -e "s/__VERSION__/${{ steps.v.outputs.version }}/" -e "s/__BUILD__/${GITHUB_RUN_NUMBER}/" \
            macos/app/Info.plist > "$A/Info.plist"
          cp kbin/kmonad-p* "$A/Resources/bin/"
          cp macos/pkg/kmonad-cmd "$A/Resources/bin/"
          cp macos/app/template.kbd macos/pkg/uninstall.sh macos/pkg/io.github.zikisoy.kmonad.daemon.plist "$A/Resources/"
          python3 macos/tools/extract-k.py kmonad.svg "$A/Resources/K.svg"
          if ! swift macos/tools/make-icon.swift "$A/Resources/K.svg" build/AppIcon.iconset; then
            brew install librsvg
            rsvg-convert -h 1024 "$A/Resources/K.svg" -o build/K.png
            swift macos/tools/make-icon.swift build/K.png build/AppIcon.iconset
          fi
          iconutil -c icns build/AppIcon.iconset -o "$A/Resources/AppIcon.icns"
          chmod 755 "$A/MacOS/KMonad" "$A/Resources/bin/"* "$A/Resources/uninstall.sh"

      - name: Fetch Karabiner VirtualHIDDevice ${{ env.VHID_VERSION }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/tags/$VHID_VERSION" \
            | jq -r '.assets[] | select(.name | endswith(".pkg")) | .browser_download_url' | head -1)
          echo "$URL"
          P=build/KMonad.app/Contents/Resources/Karabiner-DriverKit-VirtualHIDDevice.pkg
          curl -fsSL -o "$P" "$URL"
          pkgutil --check-signature "$P" | tee sig.txt
          grep -q "G43BCU2T37" sig.txt   # pqrs.org Developer ID

      - name: Sign
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          APP=build/KMonad.app
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGN_P12 not set: ad hoc signature (Input Monitoring must be granted again after updates)"
            ID=-
          else
            KC="$RUNNER_TEMP/kmonad.keychain-db"; KCPW=$(openssl rand -hex 16)
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-identity -p codesigning "$KC"
            ID=$(security find-identity -p codesigning "$KC" | awk '/KMonad Signing/ {print $2; exit}')
            [ -n "$ID" ] || { echo "signing identity not found"; exit 1; }
          fi
          sign() { codesign --force --timestamp=none --sign "$ID" "$@"; }
          for p in 5 6 7; do sign --identifier io.github.zikisoy.kmonad.p$p "$APP/Contents/Resources/bin/kmonad-p$p"; done
          sign --identifier io.github.zikisoy.kmonad "$APP/Contents/MacOS/KMonad"
          sign "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP"
          codesign -d -r- "$APP/Contents/Resources/bin/kmonad-p7"
          find "$APP" -type f | sort

      - name: Build installer
        shell: bash
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p build/scripts
          cp macos/pkg/preinstall macos/pkg/postinstall build/scripts/
          cat > build/component.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array><dict>
            <key>RootRelativeBundlePath</key><string>KMonad.app</string>
            <key>BundleIsRelocatable</key><false/>
            <key>BundleIsVersionChecked</key><false/>
            <key>BundleHasStrictIdentifier</key><false/>
            <key>BundleOverwriteAction</key><string>upgrade</string>
          </dict></array></plist>
          EOF
          mkdir -p build/root && cp -R build/KMonad.app build/root/
          pkgbuild --root build/root --install-location /Applications --scripts build/scripts \
            --identifier io.github.zikisoy.kmonad --version "$V" \
            --component-plist build/component.plist build/component.pkg
          productbuild --package build/component.pkg "KMonad-$V.pkg"
          shasum -a 256 "KMonad-$V.pkg" | tee "KMonad-$V.pkg.sha256"
          echo "PKG=KMonad-$V.pkg" >> "$GITHUB_ENV"

      - name: Smoke test - install twice, uninstall
        shell: bash
        timeout-minutes: 10
        run: |
          L=io.github.zikisoy.kmonad.daemon
          for i in 1 2; do
            sudo installer -pkg "$PKG" -target /
            sleep 6
            sudo launchctl print system/$L | grep -E "state = running"
          done
          /Applications/KMonad.app/Contents/MacOS/KMonad --status
          ls -l /Library/Logs/KMonad
          sudo cat /Library/Logs/KMonad/daemon.log | tail -20
          sudo /Applications/KMonad.app/Contents/Resources/uninstall.sh
          sleep 2
          test ! -e /Library/LaunchDaemons/$L.plist
          test ! -e /Applications/KMonad.app
          ! sudo launchctl print system/$L >/dev/null 2>&1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KMonad-installer
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
